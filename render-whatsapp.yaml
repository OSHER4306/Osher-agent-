services:
  - type: web
    name: osher-whatsapp-remote
    runtime: node
    plan: free
    region: frankfurt
    rootDir: whatsapp-bridge
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: osher-agent-connections
          property: connectionString
      - key: AGENT_KEY
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: LOG_LEVEL
        value: warn
