name: Deploy Osher Agent
# Deploy only when public site assets change. Backend, automation and
# research commits must not trigger redundant Pages deployments.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - ".nojekyll"
      - "index.html"
      - "iphone-web.html"
      - "remote.html"
      - "icon.svg"
      - "manifest.webmanifest"
      - "sw.js"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
