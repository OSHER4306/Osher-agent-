<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>OSHER AGENT · WhatsApp Linked Device</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}
.card{width:min(680px,100%);background:#11141b;border:1px solid #2b3242;border-radius:28px;padding:26px;box-shadow:0 25px 70px #0009}
.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#9b82ff,#4d2ce8);display:grid;place-items:center;font-size:30px;margin-bottom:16px}
h1{margin:0 0 8px;font-size:30px}.muted{color:#aab2c1;line-height:1.6}.phone{font-size:22px;font-weight:800;margin:18px 0;padding:14px;background:#090b10;border:1px solid #2a3140;border-radius:14px;text-align:center;direction:ltr}
.steps{display:grid;gap:10px;margin:20px 0}.step{padding:13px;border:1px solid #2a3140;border-radius:14px;background:#0d1018}.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#6d50f5;margin-left:8px;font-weight:800}
button{width:100%;border:0;border-radius:15px;padding:14px;font-size:16px;font-weight:800;color:white;background:linear-gradient(135deg,#8d70ff,#5d3cf0);cursor:pointer}.secondary{margin-top:10px;background:#181d27;border:1px solid #303747}.warn{margin-top:16px;color:#ffd66e;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<div class="logo">⚡</div>
<h1 id="title">חיבור WhatsApp אישי</h1>
<p id="intro" class="muted">העמוד הזה הוא רק אשף חיבור. ההתחברות עצמה מתבצעת ב‑WhatsApp הרשמי.</p>
<div id="phone" class="phone" style="display:none"></div>
<div id="steps" class="steps"></div>
<button id="open">פתח WhatsApp Web הרשמי</button>
<button id="copy" class="secondary">העתק קישור</button>
<div class="warn">הקוד או ה‑QR חייבים להגיע מ‑WhatsApp Web/Windows/Mac הרשמי. אל תמסור קוד קישור לאדם אחר.</div>
</div>
<script>
const q=new URLSearchParams(location.search);
const mode=q.get('mode')==='qr'?'qr':'phone';
const phone=(q.get('phone')||'').replace(/[^+\d]/g,'');
const mobile=/iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
const title=document.getElementById('title');
const intro=document.getElementById('intro');
const phoneEl=document.getElementById('phone');
const steps=document.getElementById('steps');
const open=document.getElementById('open');
const copy=document.getElementById('copy');

const step=t=>'<div class="step">'+t+'</div>';

if(mode==='qr'){
  title.textContent='חיבור אישי באמצעות QR';
  steps.innerHTML=[
    step('<span class="num">1</span>פתח WhatsApp Web במחשב.'),
    step('<span class="num">2</span>יופיע QR רשמי של WhatsApp.'),
    step('<span class="num">3</span>באייפון: WhatsApp → Settings → Linked Devices → Link a Device.'),
    step('<span class="num">4</span>סרוק את ה‑QR שמופיע במחשב.')
  ].join('');
}else{
  title.textContent='חיבור אישי באמצעות מספר + קוד';
  if(phone){phoneEl.style.display='block';phoneEl.textContent=phone;}
  steps.innerHTML=[
    step('<span class="num">1</span>פתח WhatsApp Web במחשב ובחר <b>Link with phone number</b>.'),
    step('<span class="num">2</span>בחר מדינה והכנס את מספר ה‑WhatsApp שלך.'),
    step('<span class="num">3</span>WhatsApp יציג קוד חד־פעמי בן <b>8 תווים</b>.'),
    step('<span class="num">4</span>באייפון: WhatsApp → Settings → Linked Devices → Link a Device → Link with phone number instead.'),
    step('<span class="num">5</span>אשר את המכשיר והקלד את הקוד.')
  ].join('');
}

async function shareToDesktop(){
  const url=location.href;
  try{
    if(navigator.share){await navigator.share({title:'OSHER AGENT · WhatsApp Linked Device',text:'פתח את הקישור במחשב:',url});return;}
  }catch(e){}
  try{await navigator.clipboard.writeText(url);copy.textContent='הקישור הועתק ✓';}catch(e){copy.textContent='העתק מהשורת כתובת';}
}

if(mobile){
  intro.innerHTML='פתחת את האשף במובייל. כדי לקבל QR או קוד קישור רשמי, פתח אותו <b>במחשב/Windows/Mac</b>.';
  open.textContent='שתף את החיבור למחשב';
  open.onclick=shareToDesktop;
}else{
  open.onclick=()=>location.href='https://web.whatsapp.com/';
}
copy.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);copy.textContent='הקישור הועתק ✓';}catch(e){copy.textContent='העתק מהשורת כתובת';}};
</script>
</body>
</html>
